name: windows-native-witness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/Zeroshot.Sdk/Execution/**
      - src/Zeroshot.Sdk/NamedPipeSecurity.cs
      - src/Zeroshot.Sdk/OecpConnection.cs
      - src/Zeroshot.Sdk/OecpConnection.Streams.cs
      - src/Zeroshot.Sdk/OecpTransport.cs
      - examples/ControllerConsumer/**
      - tools/native-witness/controller-provider.py
      - tools/native-witness/windows-controller.ps1
      - tools/native-witness/windows/**
      - .github/workflows/windows-native-witness.yml

jobs:
  controller-pipe:
    # Native 10.9.0 ships no Windows arm64 build, so x64 is the only applicable platform.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: ./tools/native-witness/windows-controller.ps1
        shell: pwsh
