name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Zeroshot.sln --configuration Release
      - run: dotnet test --project tests/Zeroshot.Cli.Tests/Zeroshot.Cli.Tests.csproj --configuration Release --no-restore
      - run: dotnet test --project tests/Zeroshot.Sdk.Tests/Zeroshot.Sdk.Tests.csproj --configuration Release --no-restore
      - run: dotnet pack src/Zeroshot.Sdk/Zeroshot.Sdk.csproj --configuration Release --no-build --output artifacts/packages
      - run: dotnet restore examples/ContractsConsumer/ContractsConsumer.csproj --source artifacts/packages --source https://api.nuget.org/v3/index.json
      - run: dotnet run --project examples/ContractsConsumer/ContractsConsumer.csproj --configuration Release --no-restore

  windows-pipes:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-vs2026-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet --info
      - run: dotnet build tests/Zeroshot.Sdk.Tests/Zeroshot.Sdk.Tests.csproj --configuration Release
      # Controlled local pipes with explicit descriptors; the stock-native pipe witness is windows-native-witness.yml.
      - run: dotnet test --project tests/Zeroshot.Sdk.Tests/Zeroshot.Sdk.Tests.csproj --configuration Release --no-build --treenode-filter "/*/*/NamedPipeConnectionTests/*"
